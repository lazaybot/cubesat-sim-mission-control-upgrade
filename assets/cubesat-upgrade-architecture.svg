<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CubeSat mission-control upgrade architecture</title>
  <desc id="desc">Measured, derived, simulated, and mocked data enter a provenance layer before reaching mission control, replay, and fault testing.</desc>
  <rect width="1200" height="520" fill="#08111f"/>
  <style>
    .box{fill:#11243b;stroke:#45d7ff;stroke-width:3;rx:18}.sim{stroke:#b66cff}.out{stroke:#55e39b}
    .t{font:700 24px system-ui;fill:#fff}.s{font:18px system-ui;fill:#d8e8ff}.a{stroke:#86a8c7;stroke-width:4;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#86a8c7"/></marker></defs>
  <text x="600" y="48" text-anchor="middle" class="t">Mission control that shows where every value came from</text>
  <rect x="40" y="90" width="240" height="78" class="box"/><text x="160" y="122" text-anchor="middle" class="t">MEASURED</text><text x="160" y="149" text-anchor="middle" class="s">physical sensors</text>
  <rect x="40" y="190" width="240" height="78" class="box"/><text x="160" y="222" text-anchor="middle" class="t">DERIVED</text><text x="160" y="249" text-anchor="middle" class="s">documented calculation</text>
  <rect x="40" y="290" width="240" height="78" class="box sim"/><text x="160" y="322" text-anchor="middle" class="t">SIMULATED</text><text x="160" y="349" text-anchor="middle" class="s">orbit model</text>
  <rect x="40" y="390" width="240" height="78" class="box sim"/><text x="160" y="422" text-anchor="middle" class="t">MOCKED</text><text x="160" y="449" text-anchor="middle" class="s">fault experiments</text>
  <line x1="280" y1="129" x2="430" y2="220" class="a"/><line x1="280" y1="229" x2="430" y2="240" class="a"/><line x1="280" y1="329" x2="430" y2="260" class="a"/><line x1="280" y1="429" x2="430" y2="280" class="a"/>
  <rect x="430" y="170" width="320" height="160" class="box"/><text x="590" y="220" text-anchor="middle" class="t">PROVENANCE LAYER</text><text x="590" y="254" text-anchor="middle" class="s">keep nulls • label source</text><text x="590" y="282" text-anchor="middle" class="s">timestamp • validate schema</text><text x="590" y="310" text-anchor="middle" class="s">never invent telemetry</text>
  <line x1="750" y1="215" x2="895" y2="145" class="a"/><line x1="750" y1="250" x2="895" y2="250" class="a"/><line x1="750" y1="285" x2="895" y2="355" class="a"/>
  <rect x="895" y="90" width="265" height="105" class="box out"/><text x="1027" y="132" text-anchor="middle" class="t">LIVE CONSOLE</text><text x="1027" y="162" text-anchor="middle" class="s">health + telemetry</text>
  <rect x="895" y="205" width="265" height="105" class="box out"/><text x="1027" y="247" text-anchor="middle" class="t">MISSION REPLAY</text><text x="1027" y="277" text-anchor="middle" class="s">recorded timeline</text>
  <rect x="895" y="320" width="265" height="105" class="box out"/><text x="1027" y="362" text-anchor="middle" class="t">FAULT LAB</text><text x="1027" y="392" text-anchor="middle" class="s">expected vs actual</text>
  <text x="600" y="495" text-anchor="middle" class="s">Proposal architecture — not a claim that these screens are already implemented</text>
</svg>
